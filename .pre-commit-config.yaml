# Run through prek, not pre-commit: `prek run`, `prek install`. The file format is
# pre-commit's, which is why the filename is unchanged.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # types_or is overridden on both: upstream's ruff-format also claims `markdown`, which would let a
  # Python formatter rewrite the fenced blocks in every skill and record here. No args, so Python
  # wraps at ruff's own 88 rather than at .editorconfig's 100 — narrower, so nothing conflicts, and
  # no width is configured twice.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        types_or: [python]
      - id: ruff-format
        types_or: [python]

  - repo: local
    hooks:
      # check-json above proves the manifests parse; this proves the two that decide whether the
      # marketplace loads at all are present and name themselves. A marketplace whose `plugins`
      # array points at a directory with no plugin.json fails at install time, on the user's machine.
      - id: manifests-well-formed
        name: marketplace and plugin manifests name themselves
        language: system
        pass_filenames: false
        always_run: true
        entry: >-
          bash -c 'rc=0;
          m=.claude-plugin/marketplace.json;
          node -e "const j=require(\"./$m\"); if(!j.name||!Array.isArray(j.plugins)) process.exit(1)"
          || { echo "$m: needs a name and a plugins array."; rc=1; };
          for p in */.claude-plugin/plugin.json; do [ -e "$p" ] || continue;
          node -e "const j=require(\"./$p\"); if(!j.name) process.exit(1)"
          || { echo "$p: needs a name."; rc=1; }; done; exit $rc'

      # A plugin's version names its install cache directory,
      # `~/.claude/plugins/cache/<marketplace>/<plugin>/<version>`, so an edited skill that ships
      # without a bump keeps serving the copy a consumer already installed — silently, and only on
      # their machine.
      # The base is the release boundary, not the previous commit: what reaches a consumer is the
      # branch, so one bump per branch is what the cache needs. Comparing against the index instead
      # charged a bump per commit, which on a branch that already bumped is version churn nothing
      # ships. Default is the merge base with origin/main; `lint:versions` names origin/main
      # explicitly. The merge base is inferred from refs alone, never from what happens to be
      # staged. No remote, or a base that does not resolve, falls back to HEAD — the old
      # index-versus-HEAD behaviour — so the gate is silent rather than wrong.
      # `scripts` counts alongside skills, agents and commands: a consumer runs the cached copy of a
      # script, so a fixed payload that ships without a bump keeps sending the broken one.
      # No filenames: the unit is the plugin, and prek splits long filename lists across invocations.
      - id: plugin-version-bumped
        name: an edited plugin bumps its version
        language: system
        pass_filenames: false
        always_run: true
        entry: >-
          bash -c 'cmp=${PLUGIN_VERSION_BASE:-};
          [ -n "$cmp" ] || cmp=$(git merge-base HEAD origin/main 2>/dev/null);
          [ -n "$cmp" ] || cmp=HEAD;
          git rev-parse --verify -q "$cmp" >/dev/null || exit 0;
          rc=0;
          for m in */.claude-plugin/plugin.json; do [ -e "$m" ] || continue;
          p="${m%%/*}";
          git diff --cached --quiet "$cmp" -- "$p/skills" "$p/agents" "$p/commands" "$p/scripts"
          && continue;
          git diff --cached "$cmp" -- "$m" | grep -q "^+.*\"version\"" ||
          { echo "$p: skills, agents, commands or scripts changed against $cmp but $m version did not.
          Bump it, or consumers keep the cached copy."; rc=1; };
          done;
          exit $rc'

      # Local and `language: system` so it is the mise-pinned binary rather than a second copy a
      # remote hook would install. No filenames: .taplo.toml decides which TOML is ours.
      - id: taplo-fmt
        name: taplo fmt
        entry: taplo fmt
        language: system
        types: [toml]
        pass_filenames: false

      # Args match the upstream hook's defaults; --files must stay last so prek's filenames
      # land after it.
      - id: cspell
        name: cspell
        entry: cspell-cli
        language: system
        types: [text]
        args:
          - --no-must-find-files
          - --no-progress
          - --no-summary
          - --gitignore
          - --files

      # The one check that runs something this repository ships, per ADR 0002. `ruff` proves the
      # script parses; only this proves the payloads it builds are still the intended ones.
      # `files:` keeps it off every run that does not touch the script.
      - id: repo-settings-self-check
        name: the scaffold baseline script self-checks
        entry: python3 scaffold/scripts/repo_settings.py --self-check
        language: system
        files: ^scaffold/scripts/
        pass_filenames: false

      # `.markdownlint-cli2.jsonc` owns which files and rules apply, so no args are needed here.
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2
        language: system
        types: [markdown]
